<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="240" role="img" aria-labelledby="t">
  <title id="t">Line illustration of a beige CRT research workstation showing a terminal listing: research, vision, remote_sensing, learning</title>
  <g stroke="#3b3b3b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- monitor -->
    <rect x="50" y="10" width="160" height="122" rx="9" fill="#ddd7c7"/>
    <rect x="62" y="22" width="136" height="90" rx="7" fill="#c9c3b2"/>
    <rect x="68" y="28" width="124" height="78" rx="5" fill="#1f2527"/>
    <!-- controls -->
    <circle cx="190" cy="122" r="2.5" fill="#8fa89a" stroke="none"/>
    <line x1="68" y1="122" x2="92" y2="122"/>
    <line x1="68" y1="126" x2="92" y2="126"/>
    <!-- stand -->
    <path d="M104 132 h52 l6 12 h-64 z" fill="#ddd7c7"/>
    <!-- keyboard -->
    <path d="M62 166 h136 l6 18 h-148 z" fill="#ddd7c7"/>
    <g stroke="#8a8578" stroke-width="1" stroke-dasharray="4 3">
      <line x1="70" y1="172" x2="192" y2="172"/>
      <line x1="68" y1="177" x2="194" y2="177"/>
    </g>
    <line x1="92" y1="181.5" x2="168" y2="181.5" stroke="#8a8578" stroke-width="1"/>
    <!-- papers -->
    <rect x="8" y="170" width="38" height="5" fill="#f1eee4"/>
    <rect x="10" y="164" width="34" height="5" fill="#e6e1d2"/>
    <rect x="12" y="158" width="30" height="5" fill="#f1eee4"/>
    <!-- floppy disks -->
    <rect x="216" y="152" width="30" height="30" rx="2" fill="#4a5258"/>
    <rect x="222" y="152" width="16" height="10" fill="#c9c3b2"/>
    <rect x="223" y="168" width="20" height="14" fill="#f1eee4"/>
    <rect x="212" y="140" width="30" height="8" rx="1" fill="#4a5258" transform="rotate(-6 227 144)"/>
    <!-- desk -->
    <line x1="4" y1="188" x2="256" y2="188" stroke-width="1"/>
  </g>
  <!-- screen text -->
  <g font-family="'Courier New', Courier, monospace" font-size="8.5" fill="#8fa89a">
    <text x="76" y="44">research/</text>
    <text x="76" y="58">  vision</text>
    <text x="76" y="70">  remote_sensing</text>
    <text x="76" y="82">  learning</text>
    <text x="76" y="98">&gt; _</text>
  </g>
</svg>
